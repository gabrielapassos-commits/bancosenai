<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <title>Gestão de Documentos - Banco Senai</title>
    <link rel="stylesheet" href="documento.css">
</head>
<body>
    <h1>Gestão de documentos</h1>
    <div class="form-container">
        <input type="number" id="codigoCliente" placeholder="Código do Cliente" />
        <input type="file" id="arquivo" />
        <button type="button" onclick="enviarDocumento()">Enviar</button>
        <button type="button" onclick="listarDocumento()">Buscar Documentos</button>
    </div>
    <table id="tabelaDocumentos">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nome</th>
                <th>Extensão</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="corpoTabela">
        </tbody>
    </table>
    <script src="documento.js"></script>
</body>
</html>
